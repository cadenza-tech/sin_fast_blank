name: Test
on:
  pull_request:
    paths:
      - '.github/workflows/test.yml'
      - 'Gemfile'
      - 'Rakefile'
      - 'sin_fast_blank.gemspec'
      - 'ext/**/*'
      - 'lib/**/*'
      - '**/*.rb'
  schedule:
    - cron: '0 12 * * 5'
  workflow_call:
permissions:
  contents: read
jobs:
  test-ubuntu:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - '2.3'
          - '2.4'
          - '2.5'
          - '2.6'
          - '2.7'
          - '3.0'
          - '3.1'
          - '3.2'
          - '3.3'
          - '3.4'
          - '4.0'
          - 'ruby-head'
          - 'jruby-9.1'
          - 'jruby-9.2'
          - 'jruby-9.3'
          - 'jruby-9.4'
          - 'jruby-10.0'
          - 'jruby-10.1'
          - 'jruby-head'
          - 'truffleruby-22'
          - 'truffleruby-23'
          - 'truffleruby-24'
          - 'truffleruby-25'
          - 'truffleruby-33'
          - 'truffleruby-34'
          - 'truffleruby-head'
          - 'truffleruby+graalvm-22'
          - 'truffleruby+graalvm-23'
          - 'truffleruby+graalvm-24'
          - 'truffleruby+graalvm-25'
          - 'truffleruby+graalvm-33'
          - 'truffleruby+graalvm-34'
          - 'truffleruby+graalvm-head'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Run compile
        run: bundle exec rake compile
      - name: Run tests
        run: bundle exec rake test
  test-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - '3.4'
          - '4.0'
          - 'jruby-9.4'
          - 'jruby-10.1'
          - 'truffleruby-24'
          - 'truffleruby-34'
          - 'truffleruby+graalvm-24'
          - 'truffleruby+graalvm-34'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Run compile
        run: bundle exec rake compile
      - name: Run tests
        run: bundle exec rake test
  test-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - 'mingw'
          - 'mswin'
          - 'ucrt'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Run compile
        run: bundle exec rake compile
      - name: Run tests
        run: bundle exec rake test
  verify-jar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Rebuild Java extension
        run: |
          docker run --rm -v "${PWD}:/app" -w /app jruby:9.1.17.0-jdk bash -c '
            set -eu
            cd ext/java
            javac -cp /opt/jruby/lib/jruby.jar sin_fast_blank/SinFastBlankLibrary.java
          '
      - name: Compare rebuilt classes with committed jar
        run: |
          mkdir -p tmp/committed
          unzip -o -q lib/sin_fast_blank/sin_fast_blank.jar -d tmp/committed
          diff -r --exclude='*.java' --exclude='META-INF' tmp/committed ext/java
